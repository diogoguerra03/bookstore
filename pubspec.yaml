name: bookstore
description: "Course project development for mobile devices."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  logger: ^1.0.0 # Para logs
  http: ^0.13.4 # Para requisições HTTP
  encrypt: ^5.0.0 # Para criptografia
  sqflite: ^2.0.0+4 # Para usar o SQLite
  path: ^1.8.0 # Para trabalhar com caminhos
  crypto: ^3.0.1 # Para criptografia
  shared_preferences: ^2.0.6 # Para salvar dados localmente
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  cloud_firestore: ^5.4.4
  path_provider: ^2.1.4
  firebase_app_check: ^0.3.1+3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/No_Cover.jpg
    - assets/images/favorites.png
