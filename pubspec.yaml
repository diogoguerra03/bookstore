name: bookstore
description: "Course project development for mobile devices."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  logger: ^1.0.0 # Para logs
  http: ^0.13.4 # Para requisições HTTP
  encrypt: ^5.0.0  # Para criptografia
  sqflite: ^2.0.0+4 # Para usar o SQLite
  path: ^1.8.0  # Para trabalhar com caminhos
  crypto: ^3.0.1 # Para criptografia

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/No_Cover.jpg
